---
- name: Provision the explicitly requested Windows VM without starting it
  hosts: all
  connection: local
  gather_facts: true
  become: true
  pre_tasks:
    - name: Require native Ubuntu and explicit GPU VM configuration
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - "'microsoft' not in ansible_facts.kernel | lower"
          - cfg.virtualization and cfg.gpu_handoff and cfg.windows_vm
  roles:
    - role: windows_vm
