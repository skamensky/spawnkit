---
# Pinned guest software. Downloads are verified against these hashes before use;
# updating one means changing its URL, hash and (for bundles) product_id together.
windows_guest_cache: C:\ProgramData\spawnkit\cache
# Windows pointer speed, 1-20 (Windows' default is 10); takes effect at the next sign-in.
windows_guest_mouse_sensitivity: 6
# Input languages in order (the first is the default) with one keyboard each, like Ubuntu's
# us+il; the display language and regional format are unaffected. Tags are in the form
# Windows stores (it shortens he-IL to he); keyboards are LANGID:KLID input method tips,
# 0000040D being the Hebrew layout that matches xkb's il.
windows_guest_input_languages:
  - {tag: en-US, keyboard: '0409:00000409'}
  - {tag: he, keyboard: '040D:0000040D'}
# Where Ubuntu's CopyQ publishes its tabs (personal.desktop.copyqShare, under the share's Z:).
windows_guest_copyq_share: Z:\.copyq
windows_guest_pins:
  virtio_tools:
    url: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.302-1/virtio-win-guest-tools.exe
    file: virtio-win-guest-tools-0.1.302.exe
    sha256: d8ae9ea1e943384ac195e012cd36f82c3161620e5fc9529be4e42e6f420e222d
    product_id: '{d76c31f9-9ea7-4266-bea9-a9875f742217}'
  winfsp:
    url: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
    file: winfsp-2.1.25156.msi
    sha256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  # Upstream's bleeding-edge IDD build of master cdba29f2; it must match the client's upstream
  # commit (nix/modules/home/virtualization.nix). The file URL is content-addressed.
  looking_glass:
    url: https://looking-glass.io/artifact/file/idd/bf91dbe3b69d369f8180247881739144308c2c0f6c85785ab8220d8a8e4b2665/37268383971e4ee63481f59c427432ca/download.bin?name=looking-glass-idd-B7-829-cdba29f2.zip
    file: looking-glass-idd-B7-829-cdba29f2.zip
    sha256: bf91dbe3b69d369f8180247881739144308c2c0f6c85785ab8220d8a8e4b2665
    # The DisplayVersion its installer registers (git describe of the commit).
    version: B7-829-gcdba29f2f6
  # Driver only (no NVIDIA app). 616.56 bug-checks the passed-through RTX on unload, so Windows
  # Update may not deliver display drivers; inf names the package's INF for the GPU's SUBSYS.
  nvidia:
    url: https://us.download.nvidia.com/Windows/621.01/621.01-notebook-win10-win11-64bit-international-dch-whql.exe
    file: nvidia-621.01.exe
    sha256: 9624c64705d8c6b0fb034c69faf176f2c85c804c434e478b15e6ca4e00965211
    version: 32.0.16.2101
    inf: Display.Driver\nvlti.inf
  # Tailscale updates itself after the first installation.
  tailscale:
    url: https://pkgs.tailscale.com/stable/tailscale-setup-1.104.5-amd64.msi
    file: tailscale-setup-1.104.5-amd64.msi
    sha256: 3c41318c83c5d95d0b017b1baa08ba7c99fd5334166122bbb1931e55af99839c
  # Chrome updates itself; Google replaces this unversioned MSI on each release, so a fresh
  # install fails the hash check until url's current sha256 is pinned here.
  chrome:
    url: https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi
    file: googlechromestandaloneenterprise64.msi
    sha256: 55edacd348b4c1c9b291dab19e4665929c7a127c013d9625970be924f893273f
  # Webex updates itself; like Chrome's, this unversioned MSI (46.8.0.35631 when pinned) is
  # replaced on each release, so a fresh install needs url's current sha256 pinned here.
  webex:
    url: https://binaries.webex.com/Webex-Desktop-Windows-x64-Combined-Gold/WebexBundle_en.msi
    file: WebexBundle_en.msi
    sha256: 2d63f5da05b8f23b39ce012f4804f08647830210eb72ac4d8e98ac24e768ce8e
  # Same release as Ubuntu's CopyQ, so both read the shared tab files.
  copyq:
    url: https://github.com/hluk/CopyQ/releases/download/v16.0.0/copyq-16.0.0-setup.exe
    file: copyq-16.0.0-setup.exe
    sha256: f271a1467589ca55cd56d1faf727a4bc34e686b4965ac742854a93be4b186f82
