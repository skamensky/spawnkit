---
# Plasma's task manager, forked as tech.shmuel.notifications: icons only, and a right-click menu of
# just Pin/Unpin and Close. Its QML is compiled into a C++ plugin together with the backend
# (window actions, unread badges), so the fork is rebuilt from the matching plasma-desktop source
# against Ubuntu's Plasma libraries.
- name: Inspect installed Ubuntu packages
  ansible.builtin.package_facts:
    manager: apt
- name: Require the plasma-workspace release the fork is built from
  ansible.builtin.assert:
    that: (ansible_facts.packages['plasma-workspace'] | first).version is search('^4:' ~ plasma_workspace_version | regex_escape ~ '-')
    fail_msg: >-
      Ubuntu's plasma-workspace is {{ (ansible_facts.packages['plasma-workspace'] | first).version }}; set
      plasma_workspace_version and plasma_workspace_sha256 to that release and recheck notifications.patch.
  when: not ansible_check_mode
- name: Install the notifications applet's build dependencies
  ansible.builtin.apt:
    name:
      [extra-cmake-modules, qt6-base-dev, qt6-base-private-dev, qt6-declarative-dev, qt6-wayland-dev,
       qt6-wayland-private-dev, gettext, libplasma-dev, plasma-workspace-dev, plasma-wayland-protocols,
       libwayland-dev, libkf6config-dev, libkf6coreaddons-dev, libkf6globalaccel-dev, libkf6i18n-dev,
       libkf6kio-dev, libkf6notifications-dev]
    install_recommends: false
    state: present
  when: not ansible_check_mode
- name: Create the notifications applet build directory
  ansible.builtin.file:
    path: "{{ plasma_notifications_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: plasma_notifications_build_dir
- name: Download the pinned plasma-workspace source
  ansible.builtin.get_url:
    url: https://download.kde.org/stable/plasma/{{ plasma_workspace_version }}/plasma-workspace-{{ plasma_workspace_version }}.tar.xz
    dest: "{{ plasma_notifications_dir }}/plasma-workspace-{{ plasma_workspace_version }}.tar.xz"
    checksum: sha256:{{ plasma_workspace_sha256 }}
    owner: root
    group: root
    mode: '0644'
  register: plasma_notifications_source
  # A dry run on a host without the build directory has nowhere to download to.
  when: not (ansible_check_mode and plasma_notifications_build_dir is changed)
- name: Install the fork's build files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ plasma_notifications_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0755' if item == 'build.sh' else '0644' }}"
  loop: [CMakeLists.txt, notifications.patch, build.sh]
  register: plasma_notifications_files
- name: Check for the installed notifications plugin
  ansible.builtin.stat:
    path: "{{ plasma_notifications_plugins }}/tech.shmuel.notifications.so"
  register: plasma_notifications_plugin
- name: Build and install the forked notifications applet
  ansible.builtin.command:
    argv: ["{{ plasma_notifications_dir }}/build.sh", "{{ plasma_notifications_dir }}", "{{ plasma_workspace_version }}", "{{ plasma_notifications_plugins }}"]
  when: >-
    not ansible_check_mode and (not plasma_notifications_plugin.stat.exists or plasma_notifications_source is changed
    or plasma_notifications_files is changed)
