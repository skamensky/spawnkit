---
- name: Require explicitly declared listener addresses
  ansible.builtin.assert:
    that: cfg.ssh_listen_addresses | length > 0
    fail_msg: Set ssh_listen_addresses to the intended local or tailnet addresses before enabling SSH.
- name: Install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when: not ansible_check_mode
- name: Ensure the privilege separation runtime directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
# Leave socket activation before any listener change. Otherwise the socket
# generator rewrites the live socket, systemd loses track of the inherited sshd
# (KillMode=process) and the old listener survives every restart until reboot.
- name: Use the configured SSH service rather than a competing socket listener
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: stopped
    enabled: false
  when: not ansible_check_mode
# Tailnet listeners do not exist when sshd starts at boot, and Ubuntu's unit sets
# RestartPreventExitStatus=255, so a failed bind would never recover. Allowing a
# nonlocal bind lets sshd own the address before tailscaled assigns it.
- name: Allow binding declared listeners before their interface is up
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-spawnkit-ssh.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Spawnkit: sshd listens on tailnet addresses assigned after boot.
      net.ipv4.ip_nonlocal_bind = 1
      net.ipv6.ip_nonlocal_bind = 1
  notify: Apply SSH sysctl
- name: Create the SSH unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Order sshd after tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/50-spawnkit.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Spawnkit.
      [Unit]
      Wants=network-online.target
      After=network-online.target tailscaled.service
  notify: Reload systemd for SSH
- name: Apply listener prerequisites before restarting SSH
  ansible.builtin.meta: flush_handlers
- name: Configure only Spawnkit SSH settings with a backed-up drop-in
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/00-spawnkit.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  when: not ansible_check_mode
  notify: Restart SSH
- name: Verify the full effective SSH listener configuration
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/python3', '/usr/local/libexec/spawnkit/host-state.py', 'verify-ssh', cfg.ssh_port | string] + cfg.ssh_listen_addresses }}"
  changed_when: false
  when: not ansible_check_mode
- name: Enable the configured key-only SSH listener
  ansible.builtin.systemd_service:
    name: ssh.service
    state: started
    enabled: true
  when: not ansible_check_mode
- name: Restart SSH before checking its sockets
  ansible.builtin.meta: flush_handlers
- name: Verify sshd listens only on the declared addresses
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/python3', '/usr/local/libexec/spawnkit/host-state.py', 'verify-ssh-listening', cfg.ssh_port | string] + cfg.ssh_listen_addresses }}"
  changed_when: false
  when: not ansible_check_mode
