---
- name: Apply SSH sysctl
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -p, /etc/sysctl.d/60-spawnkit-ssh.conf]
  changed_when: true
- name: Reload systemd for SSH
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
