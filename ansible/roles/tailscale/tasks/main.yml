---
- name: Create trusted APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install pinned public Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg
    dest: /etc/apt/keyrings/spawnkit-tailscale.gpg
    checksum: sha256:3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
    owner: root
    group: root
    mode: '0644'
- name: Declare signed Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/spawnkit-tailscale.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://pkgs.tailscale.com/stable/ubuntu
      Suites: {{ ansible_facts.distribution_release }}
      Components: main
      Signed-By: /etc/apt/keyrings/spawnkit-tailscale.gpg
- name: Preview Tailscale host installation
  ansible.builtin.debug:
    msg: Install tailscale, enable tailscaled and enable Tailscale SSH after tailnet login; preserve identity and do not run tailscale up or enroll credentials.
  when: ansible_check_mode
- name: Install Tailscale CLI and daemon together
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: not ansible_check_mode
- name: Enable Tailscale without changing login state
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  when: not ansible_check_mode
- name: Inspect Tailscale login state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: tailscale_status
  changed_when: false
  when: not ansible_check_mode
- name: Inspect Tailscale SSH preference
  ansible.builtin.command:
    argv: [tailscale, debug, prefs]
  register: tailscale_prefs
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - (tailscale_status.stdout | from_json).BackendState == 'Running'
- name: Enable Tailscale SSH on an authenticated personal host
  ansible.builtin.command:
    argv: [tailscale, set, --ssh, --accept-risk=lose-ssh]
  when:
    - not ansible_check_mode
    - (tailscale_status.stdout | from_json).BackendState == 'Running'
    - not (tailscale_prefs.stdout | from_json).RunSSH
# Taildrop holds received files in a root-only inbox; the owner's user service
# (personal.clients.taildrop) moves them out, which needs operator rights.
- name: Let the owner receive Taildrop files without root
  ansible.builtin.command:
    argv: [tailscale, set, '--operator={{ cfg.user }}']
  when:
    - not ansible_check_mode
    - (tailscale_status.stdout | from_json).BackendState == 'Running'
    - (tailscale_prefs.stdout | from_json).OperatorUser | default('') != cfg.user
- name: Explain post-login SSH setup
  ansible.builtin.debug:
    msg: Complete the owner's Tailscale login, then rerun host apply or run sudo tailscale set --ssh. Tailnet SSH policy and a fresh connection must be verified separately.
  when:
    - not ansible_check_mode
    - (tailscale_status.stdout | from_json).BackendState != 'Running'
