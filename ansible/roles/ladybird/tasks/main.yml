---
# Ladybird's alpha, a rolling channel built by upstream for Ubuntu. The key and sources file use
# upstream's own names (apt.ladybird.org/ladybird-<suite>.sources), so apt upgrades it like any
# Ubuntu package. Ubuntu 26.10 shares the resolute suite.
- name: Create trusted APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install Ladybird's APT repository signing key
  ansible.builtin.copy:
    src: ladybird.asc
    dest: /etc/apt/keyrings/ladybird.asc
    owner: root
    group: root
    mode: '0644'
- name: Declare Ladybird's signed APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ladybird.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://apt.ladybird.org/
      Suites: {{ 'noble' if ansible_facts.distribution_release == 'noble' else 'resolute' }}
      Components: main
      Signed-By: /etc/apt/keyrings/ladybird.asc
- name: Preview Ladybird installation
  ansible.builtin.debug:
    msg: Install ladybird (the alpha channel) from Ladybird's repository.
  when: ansible_check_mode
- name: Install Ladybird
  ansible.builtin.apt:
    name: ladybird
    state: present
    update_cache: true
  when: not ansible_check_mode
- name: Install the wrapper that runs Ladybird on the NVIDIA GPU
  ansible.builtin.copy:
    src: ladybird-rtx
    dest: /usr/local/bin/ladybird
    owner: root
    group: root
    mode: '0755'
  when: cfg.nvidia
# /usr/local/share precedes /usr/share in XDG_DATA_DIRS, so this copy of upstream's launcher,
# remade from the installed one on every apply, shadows it under the same desktop id.
- name: Read Ladybird's launcher
  ansible.builtin.slurp:
    src: /usr/share/applications/org.ladybird.Ladybird.desktop
  register: ladybird_desktop
  when: cfg.nvidia and not ansible_check_mode
- name: Create the local launcher directory
  ansible.builtin.file:
    path: /usr/local/share/applications
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: cfg.nvidia
- name: Point Ladybird's launcher at the NVIDIA wrapper
  ansible.builtin.copy:
    dest: /usr/local/share/applications/org.ladybird.Ladybird.desktop
    owner: root
    group: root
    mode: '0644'
    content: "{{ ladybird_desktop.content | b64decode | regex_replace('(?m)^Exec=/opt/ladybird/bin/Ladybird', 'Exec=/usr/local/bin/ladybird') }}"
  when: cfg.nvidia and not ansible_check_mode
