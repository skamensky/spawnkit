---
- name: Preview Ubuntu package requirements
  ansible.builtin.debug:
    msg: "Ubuntu packages: {{ (cfg.base_packages + cfg.host_packages) | join(', ') }}"
  when: ansible_check_mode
- name: Install Ubuntu host build dependencies
  ansible.builtin.apt:
    name: "{{ cfg.base_packages + cfg.host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode
# Untrusted users cannot add substituters, so the daemon trusts the cache of the
# llm-agents flake input (Claude Code, Codex) here; otherwise Codex compiles locally.
- name: Use the llm-agents binary cache in the Nix daemon
  ansible.builtin.blockinfile:
    path: /etc/nix/nix.conf
    marker: "# {mark} Spawnkit binary caches"
    block: |
      extra-substituters = https://cache.numtide.com
      extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
  notify: Restart the Nix daemon
# GDM reads this at the next login; restarting it here would end the running session.
# "wayland" only drops the override: GDM's own udev rules may still pick X11 on NVIDIA.
- name: Pin the GDM login session type
  ansible.builtin.lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^#?\s*WaylandEnable\s*='
    line: WaylandEnable=false
    insertafter: '^\[daemon\]'
    state: "{{ 'present' if cfg.desktop_session == 'x11' else 'absent' }}"
    backup: true
  when: cfg.desktop_session != ''
# Xorg opens every seat0 DRM device through logind at startup, even ones it does not use
# (AutoAddGPU off still leaves the RTX open), and that blocks the Windows handoff. Moving
# the handoff GPU's DRM nodes to a seat with no master device hides them from Xorg, logind
# and session ACLs: RTX-wired outputs and render offload go away on Linux; CUDA uses
# /dev/nvidia* and is unaffected. Sorts after systemd's 71-seat.rules; applies on the
# device's next udev event (boot).
- name: Keep the desktop seat off the handoff GPU
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/72-spawnkit-gpu-handoff.rules
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for device in cfg.gpu_devices if device.driver == 'nvidia' %}
      SUBSYSTEM=="drm", KERNELS=="{{ device.address }}", ENV{ID_SEAT}="spawnkit-gpu-handoff", TAG-="master-of-seat"
      {% endfor %}
  when: cfg.gpu_handoff
- name: Return handoff GPUs to the desktop seat
  ansible.builtin.file:
    path: /etc/udev/rules.d/72-spawnkit-gpu-handoff.rules
    state: absent
  when: not cfg.gpu_handoff
- name: Create root-owned Spawnkit configuration directory
  ansible.builtin.file:
    path: /etc/spawnkit
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Create root-owned helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/spawnkit
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the privileged host helper from the reviewed repository
  ansible.builtin.copy:
    src: host-state.py
    dest: /usr/local/libexec/spawnkit/host-state.py
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
