---
- name: Preview Ubuntu package requirements
  ansible.builtin.debug:
    msg: "Ubuntu packages: {{ (cfg.base_packages + cfg.host_packages) | join(', ') }}"
  when: ansible_check_mode
- name: Install Ubuntu host build dependencies
  ansible.builtin.apt:
    name: "{{ cfg.base_packages + cfg.host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode
# Untrusted users cannot add substituters, so the daemon trusts the cache of the
# llm-agents flake input (Claude Code, Codex) here; otherwise Codex compiles locally.
- name: Use the llm-agents binary cache in the Nix daemon
  ansible.builtin.blockinfile:
    path: /etc/nix/nix.conf
    marker: "# {mark} Spawnkit binary caches"
    block: |
      extra-substituters = https://cache.numtide.com
      extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
  notify: Restart the Nix daemon
# GDM reads this at the next login; restarting it here would end the running session.
# "wayland" only drops the override: GDM's own udev rules may still pick X11 on NVIDIA.
- name: Pin the GDM login session type
  ansible.builtin.lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^#?\s*WaylandEnable\s*='
    line: WaylandEnable=false
    insertafter: '^\[daemon\]'
    state: "{{ 'present' if cfg.desktop_session == 'x11' else 'absent' }}"
    backup: true
  when: cfg.desktop_session != ''
- name: Install KDE Plasma as an extra GDM session
  ansible.builtin.apt:
    # PySide6 drives Spawnkit's own Kirigami dialogs (scripts/spawnkit-ui) with Plasma's Qt.
    # kwin-style-aurorae draws theme window decorations such as Layan's.
    # kdeconnect pairs the Android phone: its texts, call notices and dialer (Windows' Phone Link).
    # konsole is the default terminal (kdeglobals in the Home Manager Plasma module).
    # kdegraphics-thumbnailers previews PDFs in Dolphin with Ghostscript: Ubuntu's papers.thumbnailer
    # cannot, as AppArmor lets it write only to GNOME's temporary paths, not the one KIO passes.
    # Recommends would pull in SDDM, which takes over from GDM, so the parts of a working
    # desktop that kde-plasma-desktop only recommends are listed here: brightness and power
    # (powerdevil), volume, network, displays, Bluetooth, System Settings and the KDE portal.
    name:
      [kde-plasma-desktop, kde-spectacle, kwin-style-aurorae, qt-style-kvantum, python3-pyside6.qtquick, python3-pyside6.qtqml, python3-pyside6.qtgui,
       powerdevil, plasma-pa, plasma-nm, kscreen, bluedevil, systemsettings, xdg-desktop-portal-kde, kio-extras, breeze-gtk-theme, kde-config-gtk-style,
       kinfocenter, kmenuedit, ksystemstats, plasma-systemmonitor, plasma-disks, plasma-thunderbolt, kde-config-screenlocker, libpam-kwallet5, ksshaskpass,
       appmenu-gtk3-module, kdeconnect, konsole, kdegraphics-thumbnailers]
    install_recommends: false
    state: present
  when: cfg.plasma and not ansible_check_mode
# GDM preselects, and autologin starts, the session AccountsService records for the user.
- name: Read the user's default GDM session
  ansible.builtin.command:
    argv: [busctl, get-property, org.freedesktop.Accounts, "{{ accounts_user }}", org.freedesktop.Accounts.User, Session]
  register: accounts_session
  changed_when: false
  check_mode: false
  vars:
    accounts_user: "/org/freedesktop/Accounts/User{{ ansible_facts.getent_passwd[cfg.user][1] }}"
  when: cfg.default_session != ''
- name: Set the user's default GDM session
  ansible.builtin.command:
    argv: [busctl, call, org.freedesktop.Accounts, "{{ accounts_user }}", org.freedesktop.Accounts.User, SetSession, s, "{{ cfg.default_session }}"]
  vars:
    accounts_user: "/org/freedesktop/Accounts/User{{ ansible_facts.getent_passwd[cfg.user][1] }}"
  when: cfg.default_session != '' and accounts_session.stdout != 's "' ~ cfg.default_session ~ '"'
- name: Create root-owned Spawnkit configuration directory
  ansible.builtin.file:
    path: /etc/spawnkit
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Create root-owned helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/spawnkit
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the privileged host helper from the reviewed repository
  ansible.builtin.copy:
    src: host-state.py
    dest: /usr/local/libexec/spawnkit/host-state.py
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
# Lets the seat's active user read keyboards, so spawnkit-task-manager (Home Manager) sees
# Ctrl+Shift+Esc while Citrix or the Windows VM holds the keyboard and KWin's shortcuts are off.
# logind grants the read access only to the user at the active seat, as for cameras and sound.
- name: Let the active seat user read keyboards
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-spawnkit-keyboards.rules
    content: |
      SUBSYSTEM=="input", KERNEL=="event*", ENV{ID_INPUT_KEYBOARD}=="1", TAG+="uaccess"
    owner: root
    group: root
    mode: '0644'
  when: cfg.plasma
  notify: Apply udev rules to input devices
