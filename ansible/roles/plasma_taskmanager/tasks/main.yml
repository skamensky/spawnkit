---
# Plasma's task manager, forked as tech.shmuel.taskmanager: icons only, and a right-click menu of
# just Pin/Unpin and Close. Its QML is compiled into a C++ plugin together with the backend
# (window actions, unread badges), so the fork is rebuilt from the matching plasma-desktop source
# against Ubuntu's Plasma libraries.
- name: Inspect installed Ubuntu packages
  ansible.builtin.package_facts:
    manager: apt
- name: Require the plasma-desktop release the fork is built from
  ansible.builtin.assert:
    that: (ansible_facts.packages['plasma-desktop'] | first).version is search('^4:' ~ plasma_desktop_version | regex_escape ~ '-')
    fail_msg: >-
      Ubuntu's plasma-desktop is {{ (ansible_facts.packages['plasma-desktop'] | first).version }}; set
      plasma_desktop_version and plasma_desktop_sha256 to that release and recheck taskmanager.patch.
  when: not ansible_check_mode
- name: Install the task manager's build dependencies
  ansible.builtin.apt:
    name:
      [extra-cmake-modules, qt6-base-dev, qt6-declarative-dev, gettext, libplasma-dev, plasma-workspace-dev,
       libplasmaactivities-dev, libplasmaactivitiesstats-dev, libksysguard-dev, libkf6kio-dev,
       libkf6notifications-dev, libkf6service-dev, libkf6windowsystem-dev, libkf6config-dev, libkf6i18n-dev]
    install_recommends: false
    state: present
  when: not ansible_check_mode
- name: Create the task manager build directory
  ansible.builtin.file:
    path: "{{ plasma_taskmanager_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Download the pinned plasma-desktop source
  ansible.builtin.get_url:
    url: https://download.kde.org/stable/plasma/{{ plasma_desktop_version }}/plasma-desktop-{{ plasma_desktop_version }}.tar.xz
    dest: "{{ plasma_taskmanager_dir }}/plasma-desktop-{{ plasma_desktop_version }}.tar.xz"
    checksum: sha256:{{ plasma_desktop_sha256 }}
    owner: root
    group: root
    mode: '0644'
  register: plasma_taskmanager_source
- name: Install the fork's build files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ plasma_taskmanager_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0755' if item == 'build.sh' else '0644' }}"
  loop: [CMakeLists.txt, taskmanager.patch, build.sh]
  register: plasma_taskmanager_files
- name: Check for the installed task manager plugin
  ansible.builtin.stat:
    path: "{{ plasma_taskmanager_plugins }}/tech.shmuel.taskmanager.so"
  register: plasma_taskmanager_plugin
- name: Build and install the forked task manager
  ansible.builtin.command:
    argv: ["{{ plasma_taskmanager_dir }}/build.sh", "{{ plasma_taskmanager_dir }}", "{{ plasma_desktop_version }}", "{{ plasma_taskmanager_plugins }}"]
  when: >-
    not ansible_check_mode and (not plasma_taskmanager_plugin.stat.exists or plasma_taskmanager_source is changed
    or plasma_taskmanager_files is changed)
