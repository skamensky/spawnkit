---
- name: Inspect active guests before changing lifecycle policy
  ansible.builtin.command: /usr/bin/virsh -c qemu:///system list --name
  changed_when: false
  register: active_guests
  when: not ansible_check_mode
- name: Require a quiescent VM host for lifecycle policy updates
  ansible.builtin.assert:
    that: active_guests.stdout | trim == ''
    fail_msg: Shut down guests before applying GPU hook changes; a daemon restart must not disturb live guests.
  when: not ansible_check_mode
- name: Create independent libvirt hooks directory
  ansible.builtin.file:
    path: /etc/libvirt/hooks/qemu.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install GPU lifecycle policy
  ansible.builtin.copy:
    src: gpu-guard.py
    dest: /usr/local/libexec/spawnkit/gpu-guard.py
    owner: root
    group: root
    mode: '0755'
# The policy and settings are read on every hook call; libvirt only needs a
# restart to discover a new hook file.
- name: Install a separate libvirt lifecycle hook
  ansible.builtin.copy:
    dest: /etc/libvirt/hooks/qemu.d/50-spawnkit
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      exec /usr/bin/python3 /usr/local/libexec/spawnkit/gpu-guard.py "$@"
  notify: Refresh libvirt hook discovery
- name: Declare GPU and runtime settings outside the Nix store
  ansible.builtin.copy:
    dest: /etc/spawnkit/windows.json
    owner: root
    group: root
    mode: '0644'
    content: "{{ cfg | to_nice_json }}"
- name: Declare Looking Glass shared memory permissions
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/spawnkit-looking-glass.conf
    owner: root
    group: root
    mode: '0644'
    content: "f /dev/shm/{{ cfg.looking_glass_name }} 0660 {{ cfg.user }} kvm -\n"
- name: Create shared memory file without truncating existing contents
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/spawnkit-looking-glass.conf
  changed_when: false
  when: not ansible_check_mode
# host-config's handoff primitives run without a password. Each entry is one exact
# command line; recovery (reclaim) and the libvirt hook phases still need sudo auth.
- name: Allow the user the GPU handoff primitives without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/50-spawnkit-gpu-handoff
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
    content: |
      Cmnd_Alias SPAWNKIT_GPU = {% for command in ['status', 'holders', 'detach-desktop', 'attach-desktop', 'schedule-start'] %}/usr/bin/python3 -I /usr/local/libexec/spawnkit/gpu-guard.py {{ command }}{{ '' if loop.last else ', ' }}{% endfor %}

      {{ cfg.user }} ALL=(root) NOPASSWD: SPAWNKIT_GPU
