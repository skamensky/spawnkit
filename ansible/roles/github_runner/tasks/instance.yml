---
- name: Create the runner instance directory
  ansible.builtin.file:
    path: "{{ runner_instance_directory }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0750'

- name: Extract the runner
  ansible.builtin.unarchive:
    src: "/var/cache/github-actions/runner-{{ runner_version }}.tar.gz"
    dest: "{{ runner_instance_directory }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    creates: "{{ runner_instance_directory }}/bin/Runner.Listener"

- name: Restrict the directory mode carried by the official archive
  ansible.builtin.file:
    path: "{{ runner_instance_directory }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0750'

- name: Register the repository-only runner
  ansible.builtin.command:
    argv:
      - ./config.sh
      - --unattended
      - --url
      - "https://github.com/{{ runner_repository }}"
      - --name
      - "{{ runner_instance_name }}"
      - --labels
      - "{{ runner_labels | join(',') }}"
      - --work
      - _work
    chdir: "{{ runner_instance_directory }}"
    creates: "{{ runner_instance_directory }}/.runner"
  environment:
    ACTIONS_RUNNER_INPUT_TOKEN: "{{ lookup('ansible.builtin.env', 'RUNNER_REGISTRATION_TOKEN') }}"
  become_user: "{{ runner_user }}"
  no_log: true

- name: Restrict the provider-managed runner credentials
  ansible.builtin.file:
    path: "{{ runner_instance_directory }}/{{ item }}"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0600'
  loop: [.credentials, .credentials_rsaparams]

- name: Install the official system service
  ansible.builtin.command:
    argv: [./svc.sh, install, "{{ runner_user }}"]
    chdir: "{{ runner_instance_directory }}"
    creates: "{{ runner_instance_directory }}/.service"

- name: Read the installed unit name
  ansible.builtin.slurp:
    src: "{{ runner_instance_directory }}/.service"
  register: runner_unit_file

- name: Resolve the unit name
  ansible.builtin.set_fact:
    runner_unit: "{{ runner_unit_file.content | b64decode | trim }}"

- name: Create service environment drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ runner_unit }}.d"
    state: directory
    mode: '0755'

- name: Give jobs an isolated tool cache
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ runner_unit }}.d/environment.conf"
    mode: '0644'
    content: |
      [Service]
      Slice=githubrunner.slice
      Environment=RUNNER_TOOL_CACHE=/var/cache/github-actions/toolcache
      Environment=PLAYWRIGHT_PORT={{ 52000 + (runner_index | int) }}
  register: runner_environment

- name: Enable and start the runner
  ansible.builtin.systemd_service:
    name: "{{ runner_unit }}"
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if runner_environment.changed else 'started' }}"

- name: Report the installed runner
  ansible.builtin.debug:
    msg: "{{ runner_instance_name }} serves {{ runner_repository }} through {{ runner_unit }}"
