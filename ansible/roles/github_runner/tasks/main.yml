---
- name: Refresh Google's existing package signing key
  # The old Chrome key lacked FD533C07C264648F. The primary fingerprint is
  # EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796, published by google.com/linuxrepositories.
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/trusted.gpg.d/google.asc
    checksum: sha256:54dea5f6c2a26091578cf52a999cebc6b64df478d37ad4dce96376b711e3b27c
    mode: '0644'

- name: Install runner and Chromium dependencies
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - curl
      - git
      - docker-buildx
      - python-is-python3
      - libicu70
      - libssl3
      - libkrb5-3
      - zlib1g
      - libnss3
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2
      - libpango-1.0-0
      - libcairo2
      - libx11-6
      - libxcb1
      - libxext6
      - libxshmfence1
      - fonts-liberation
      - fonts-noto-color-emoji
      - xvfb
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
    install_recommends: false

- name: Create a dedicated CI account with Docker access
  ansible.builtin.user:
    name: "{{ runner_user }}"
    system: true
    create_home: true
    home: /var/lib/github-runner
    shell: /bin/bash
    groups: docker
    append: true

- name: Create runner and tool-cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0750'
  loop:
    - "{{ runner_directory }}"
    - /var/cache/github-actions
    - /var/cache/github-actions/toolcache

- name: Fetch the checksum-pinned official runner archive
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
    dest: "/var/cache/github-actions/runner-{{ runner_version }}.tar.gz"
    checksum: "sha256:{{ runner_archive_sha256 }}"
    mode: '0644'

- name: Extract the runner
  ansible.builtin.unarchive:
    src: "/var/cache/github-actions/runner-{{ runner_version }}.tar.gz"
    dest: "{{ runner_directory }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    creates: "{{ runner_directory }}/bin/Runner.Listener"

- name: Check whether Timeshift is installed
  ansible.builtin.stat:
    path: /etc/timeshift/timeshift.json
  register: timeshift_policy

- name: Read the existing Timeshift policy
  ansible.builtin.slurp:
    src: /etc/timeshift/timeshift.json
  register: timeshift_content
  when: timeshift_policy.stat.exists

- name: Keep runner workspaces and caches out of system restore snapshots
  ansible.builtin.copy:
    dest: /etc/timeshift/timeshift.json
    mode: '0644'
    content: >-
      {{ (timeshift_content.content | b64decode | from_json) |
         combine({'exclude': (((timeshift_content.content | b64decode | from_json).exclude) +
         ['/opt/actions-runner/**', '/var/cache/github-actions/**', '/var/lib/github-runner/**']) | unique | list}) |
         to_nice_json }}
  when: timeshift_policy.stat.exists

- name: Register the repository-only runner
  ansible.builtin.command:
    argv:
      - ./config.sh
      - --unattended
      - --url
      - "https://github.com/{{ runner_repository }}"
      - --name
      - "{{ runner_name }}"
      - --labels
      - "{{ runner_labels | join(',') }}"
      - --work
      - _work
    chdir: "{{ runner_directory }}"
    creates: "{{ runner_directory }}/.runner"
  environment:
    ACTIONS_RUNNER_INPUT_TOKEN: "{{ lookup('ansible.builtin.env', 'RUNNER_REGISTRATION_TOKEN') }}"
  become_user: "{{ runner_user }}"
  no_log: true

- name: Restrict the provider-managed runner credentials
  ansible.builtin.file:
    path: "{{ runner_directory }}/{{ item }}"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0600'
  loop: [.credentials, .credentials_rsaparams]

- name: Install the official system service
  ansible.builtin.command:
    argv: [./svc.sh, install, "{{ runner_user }}"]
    chdir: "{{ runner_directory }}"
    creates: "{{ runner_directory }}/.service"

- name: Read the installed unit name
  ansible.builtin.slurp:
    src: "{{ runner_directory }}/.service"
  register: runner_unit_file

- name: Resolve the unit name
  ansible.builtin.set_fact:
    runner_unit: "{{ runner_unit_file.content | b64decode | trim }}"

- name: Create service environment drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ runner_unit }}.d"
    state: directory
    mode: '0755'

- name: Give jobs an isolated tool cache
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ runner_unit }}.d/environment.conf"
    mode: '0644'
    content: |
      [Service]
      Environment=RUNNER_TOOL_CACHE=/var/cache/github-actions/toolcache
  register: runner_environment

- name: Enable and start the runner
  ansible.builtin.systemd_service:
    name: "{{ runner_unit }}"
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if runner_environment.changed else 'started' }}"

- name: Report the installed runner
  ansible.builtin.debug:
    msg: "{{ runner_name }} serves {{ runner_repository }} through {{ runner_unit }}"
