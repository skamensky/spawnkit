---
- name: Refresh Google's existing package signing key
  # The old Chrome key lacked FD533C07C264648F. The primary fingerprint is
  # EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796, published by google.com/linuxrepositories.
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/trusted.gpg.d/google.asc
    checksum: sha256:54dea5f6c2a26091578cf52a999cebc6b64df478d37ad4dce96376b711e3b27c
    mode: '0644'

- name: Install runner and Chromium dependencies
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - curl
      - git
      - docker-buildx
      - python-is-python3
      - libicu70
      - libssl3
      - libkrb5-3
      - zlib1g
      - libnss3
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2
      - libpango-1.0-0
      - libcairo2
      - libx11-6
      - libxcb1
      - libxext6
      - libxshmfence1
      - fonts-liberation
      - fonts-noto-color-emoji
      - xvfb
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
    install_recommends: false

- name: Create a dedicated CI account with Docker access
  ansible.builtin.user:
    name: "{{ runner_user }}"
    system: true
    create_home: true
    home: /var/lib/github-runner
    shell: /bin/bash
    groups: docker
    append: true

- name: Create shared tool-cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0750'
  loop:
    - /var/cache/github-actions
    - /var/cache/github-actions/toolcache

- name: Fetch the checksum-pinned official runner archive
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
    dest: "/var/cache/github-actions/runner-{{ runner_version }}.tar.gz"
    checksum: "sha256:{{ runner_archive_sha256 }}"
    mode: '0644'

- name: Check whether Timeshift is installed
  ansible.builtin.stat:
    path: /etc/timeshift/timeshift.json
  register: timeshift_policy

- name: Read the existing Timeshift policy
  ansible.builtin.slurp:
    src: /etc/timeshift/timeshift.json
  register: timeshift_content
  when: timeshift_policy.stat.exists

- name: Disable scheduled snapshots and exclude CI state
  ansible.builtin.copy:
    dest: /etc/timeshift/timeshift.json
    mode: '0644'
    content: >-
      {{ (timeshift_content.content | b64decode | from_json) |
         combine({'schedule_boot': 'false', 'schedule_daily': 'false',
         'schedule_hourly': 'false', 'schedule_monthly': 'false', 'schedule_weekly': 'false',
         'exclude': (((timeshift_content.content | b64decode | from_json).exclude) +
         ['/opt/actions-runner/**', '/var/cache/github-actions/**', '/var/lib/github-runner/**']) | unique | list}) |
         to_nice_json }}
  when: timeshift_policy.stat.exists

- name: Require a bounded worker count
  ansible.builtin.assert:
    that:
      - runner_count | int >= 1
      - runner_count | int <= 10
      - runner_cpu_quota_percent | int >= 100
      - runner_cpu_quota_percent | int <= 800

- name: Configure the shared resource budget
  ansible.builtin.include_tasks: resources.yml

- name: Configure each worker slot
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ range(1, (runner_count | int) + 1) | list }}"
  loop_control:
    loop_var: runner_index
  vars:
    runner_instance_directory: "{{ runner_directory if runner_index == 1 else runner_directory ~ ('-%02d' | format(runner_index)) }}"
    runner_instance_name: "{{ runner_name if runner_index == 1 else runner_name ~ ('-%02d' | format(runner_index)) }}"
