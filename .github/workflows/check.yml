name: Validate personal infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  home-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Build host profiles and test bootstrap safety
        run: nix run .#home-config -- check --repo "$GITHUB_WORKSPACE"
      - name: Build automatically selected default on an unknown CI hostname
        run: nix run .#home-config -- build --repo "$GITHUB_WORKSPACE"
      - name: Test isolated activation and unmanaged file protection
        run: bash tests/home-activation.sh
