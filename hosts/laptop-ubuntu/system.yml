# Hardware values are filled from `host-config facts` on native Ubuntu.
docker: true
tailscale: true
nvidia: true
nvidia_prime: on-demand
# 550 is retired (Ubuntu's 550 package now depends on 580). Pin the 580 long-term branch
# instead of following ubuntu-drivers' "recommended" newer branch.
nvidia_driver_package: nvidia-driver-580
# GNOME 50 (Ubuntu 26.04) has no Xorg session, so GDM must offer Wayland.
desktop_session: wayland
# Trial (migration D7); GNOME stays installed as the fallback session.
plasma: true
default_session: plasma
virtualization: true
iommu: true
# Solaar needs Ubuntu's udev rules for Logitech receiver access; cmake and ninja join the
# Ubuntu build toolchain so they find system libraries.
host_packages: [solaar, cmake, ninja-build, language-pack-he, language-pack-gnome-he, hunspell-he, culmus]
webex: true
# Work's Citrix desktop runs from Ubuntu; Windows keeps the camera for calls.
citrix: true
nix_chrome: true
nix_bwrap: true
# Same tailnet identity and listener as the WSL node (migration C4); key-only.
ssh: true
ssh_listen_addresses: [100.86.106.55]
# Native facts 2026-11-03: the RTX and its audio function are alone in IOMMU group 13;
# the internal panel is on the Intel iGPU.
gpu_handoff: true
# Installed 2026-11-03; the RTX virtual display replaced the VGA console 2026-11-04.
windows_vm: true
windows_video: none
windows_mac: "52:54:00:a1:8d:c3"
windows_address: 192.168.123.10
windows_share: /home/shmuel/Shared
# The integrated camera (Luxvisions 30c9:00ac), for video calls in Windows.
windows_usb_devices:
  - {vendor: "0x30c9", product: "0x00ac"}
windows_computer_name: ShmuelWIndows
windows_timezone: Israel Standard Time
windows_authorized_key: /home/shmuel/.ssh/id_rsa.pub
# The laptop panel's native mode, rendered by the RTX for Looking Glass.
windows_display_gpu: NVIDIA GeForce RTX 4060 Laptop GPU
windows_display_mode: 2560x1600@60
gpu_devices:
  - {address: "0000:01:00.0", driver: nvidia}
  - {address: "0000:01:00.1", driver: snd_hda_intel}
