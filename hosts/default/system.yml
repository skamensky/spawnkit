# Shared host defaults. Native services are opt-in.
user: shmuel
# Ubuntu owns the native build toolchain and headers so source builds (uv, npm)
# link against the same glibc and libraries as the system; Home Manager ships none.
base_packages: [ca-certificates, python3-apt, build-essential, pkg-config, libssl-dev, libffi-dev,
  zlib1g-dev, libbz2-dev, liblzma-dev, libreadline-dev, libsqlite3-dev, libpq-dev]
# Profile-specific Ubuntu packages, installed in addition to base_packages.
host_packages: []
docker: false
tailscale: false
ssh: false
nvidia: false
virtualization: false
iommu: false
gpu_handoff: false
windows_vm: false
# Cisco Webex .deb (installed once; it self-updates) plus its AppArmor userns exception.
webex: false
# AppArmor userns exception for Home Manager's Chrome (desktop hosts on Ubuntu 24.04+).
nix_chrome: false
nvidia_driver_package: ""
# Hybrid laptops: "on-demand" keeps the desktop on the iGPU. Empty leaves PRIME alone.
nvidia_prime: ""
# GDM session type: "x11" pins Xorg, "wayland" removes that pin, empty leaves GDM alone.
desktop_session: ""
ssh_port: 2222
ssh_listen_addresses: []
docker_daemon: {}
gpu_devices: []
windows_name: windows
windows_uuid: ""
windows_memory_mib: 12288
windows_vcpus: 8
windows_disk_gib: 192
windows_disk: /var/lib/libvirt/images/spawnkit-windows.qcow2
windows_iso: ""
virtio_iso: ""
windows_video: vga
# Unattended installation medium from `host-config guest-media`, attached as a third CD.
windows_unattend_iso: ""
# Guest identity for guest-media and guest-apply. The local account is cfg.user.
windows_edition: Windows 11 Home
windows_computer_name: spawnkit-win
# Public key Linux uses for SSH (and Ansible) into the guest's administrator account.
windows_authorized_key: ""
# Virtual Display Driver monitor: the GPU it renders on (empty: the driver's default) and mode.
windows_display_gpu: ""
windows_display_mode: 1920x1080@60
looking_glass_mib: 128
looking_glass_name: spawnkit-windows
# Fixed guest MAC and DHCP reservation give Linux a stable SSH address for Windows.
windows_mac: ""
windows_address: ""
# Host directory exported to Windows over virtiofs (tag spawnkit-share).
windows_share: ""

network_name: spawnkit
network_uuid: "7c04dc12-ce53-4f15-b404-18afe3190591"
network_bridge: virbr-spawnkit
network_address: 192.168.123.1
network_netmask: 255.255.255.0
network_dhcp_start: 192.168.123.20
network_dhcp_end: 192.168.123.200
